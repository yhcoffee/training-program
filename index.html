/* v1.1: single-step shifts and three-lead competency signoff */
.shift-head{padding:0;display:flex;gap:0;align-items:stretch}
.shift-expand{display:flex;gap:12px;align-items:center;flex:1;min-width:0;background:transparent;border:0;text-align:left;padding:16px;cursor:pointer}
.shift-expand:hover{background:#fafaf8}
.shift-expand .title{min-width:0;flex:1;font-size:15px;font-weight:600}
.shift-expand .num{color:#999;min-width:25px;font-variant-numeric:tabular-nums}
.shift-expand .chevron{font-size:19px;color:#999}
.shift-complete{display:flex;align-items:center;gap:8px;padding:10px 17px;cursor:pointer;border-left:1px solid #eee;font-weight:600;font-size:12px;white-space:nowrap}
.shift-complete input{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
.shift-complete.is-done{background:var(--greenbg);color:var(--green)}
.shift-initial{display:inline-block;font-size:10px;letter-spacing:.03em;padding:2px 5px;border:1px solid #c8dace;border-radius:4px;color:#32604a;background:#fff;white-space:nowrap}
.competency-intro{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:0 0 17px;font-size:12px;color:#666}
.competency-intro span:last-child{white-space:nowrap;font-weight:700;color:#444}
.competency-table{padding:0;overflow:hidden}
.competency-table .section-heading{padding:18px 20px 15px;margin:0}
.competency-header,.competency-line{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,86px);gap:0;align-items:center}
.competency-header{background:#f7f7f5;color:#888;border-top:1px solid #eee;border-bottom:1px solid #eee;font-size:10px;letter-spacing:.055em;text-transform:uppercase;font-weight:700}
.competency-header span{padding:11px 16px}
.competency-header span:not(:first-child){text-align:center;padding-left:2px;padding-right:2px}
.competency-entry{border-bottom:1px solid #eee}
.competency-entry:last-child{border-bottom:0}
.competency-line{min-height:56px}
.competency-label{font-size:13px;font-weight:500;line-height:1.45;padding:12px 16px}
.lead-check{display:flex;align-items:center;justify-content:center;min-height:52px;cursor:pointer;border-left:1px solid #f1f1ef}
.lead-check input{width:22px;height:22px;margin:0;cursor:pointer;accent-color:var(--green)}
.lead-mobile-label{display:none}
.competency-note{margin:0;padding:0 16px 12px}
.competency-note textarea{font-size:12px!important;min-height:42px;max-height:110px;padding:10px 11px;background:#fafaf9;border:1px solid #eeeeeb}
@media(max-width:700px){
 .shift-expand{padding:13px 10px;gap:7px}
 .shift-expand .title{font-size:13px}
 .shift-complete{padding:8px 10px;font-size:11px;gap:5px}
 .shift-complete input{width:21px;height:21px}
 .competency-intro{align-items:flex-start;flex-direction:column;gap:5px}
 .competency-table .section-heading{padding:15px 13px}
 .competency-header,.competency-line{grid-template-columns:minmax(0,1fr) repeat(3,53px)}
 .competency-header span{padding:9px 10px}
 .competency-header span:not(:first-child){font-size:9px}
 .competency-label{font-size:12px;padding:12px 10px;overflow-wrap:anywhere}
 .lead-check{min-height:52px}
 .lead-check input{width:20px;height:20px}
 .competency-note{padding:0 10px 10px}
}
@media(max-width:350px){.competency-header,.competency-line{grid-template-columns:minmax(0,1fr) repeat(3,43px)}.competency-label{font-size:11px}.competency-header span:not(:first-child){font-size:8px}}

/* Note indicator on completed roadmap shifts */
.shift-note-flag{display:inline-flex;align-items:center;gap:5px;flex:none;padding:3px 7px;border:1px solid #ead7b5;border-radius:5px;color:#805d24;background:#fff9ee;font-size:11px;font-weight:700;white-space:nowrap}
.shift-note-flag::before{content:"";width:6px;height:6px;background:#b58a3e;border-radius:50%}
.shift-note-flag.hidden{display:none!important}
@media(max-width:700px){.shift-note-flag{font-size:10px;padding:3px 5px;gap:4px}.shift-expand{min-width:0}.shift-expand .title{min-width:0;overflow-wrap:anywhere}}

/* v1.3 program content management */
.edit-switch{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#666;cursor:pointer;user-select:none;padding:7px 2px}
.edit-switch input{position:absolute;width:1px;height:1px;opacity:0}
.switch-track{display:inline-block;width:39px;height:23px;border:1px solid #d0d0cc;border-radius:20px;background:#dddeda;position:relative;transition:background .16s}
.switch-track:after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:transform .16s}
.edit-switch input:checked+.switch-track{background:#202020;border-color:#202020}
.edit-switch input:checked+.switch-track:after{transform:translateX(16px)}
.edit-switch input:focus-visible+.switch-track{outline:2px solid #444;outline-offset:3px}
.edit-switch.is-active{color:#171717}
.program-tools{display:flex;justify-content:flex-end;min-height:9px;margin-bottom:10px}
.program-week{margin:0 0 23px;min-width:0}
.program-week-top{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid #cececa;padding:12px 0;margin-bottom:11px;min-width:0}
.program-week-title{min-width:0;flex:1}
.program-week-title h2{font:400 23px/1.35 'Nixie One',Georgia,serif;margin:2px 0 0;overflow-wrap:anywhere}
.week-index{color:#888;font-size:10px;font-weight:700;letter-spacing:.1em}
.program-edit-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.program-edit-actions .btn{font-size:11px;min-height:34px;padding:6px 10px}
.program-shift .shift-head{width:100%;display:flex;padding:0;align-items:stretch}
.program-shift .shift-expand{width:100%;min-width:0}
.program-shift .shift-body{padding:17px 20px 20px}
.shift-edit-actions{margin-bottom:17px;padding-bottom:12px;border-bottom:1px solid #eee;justify-content:flex-end}
.editor-content{display:grid;gap:14px}
.editor-content .skill-group{margin:0}
.editor-content .section-heading{align-items:center;flex-wrap:wrap}
.editor-content .editrow .left{line-height:1.5;overflow-wrap:anywhere}
@media(max-width:700px){
 .program-week-top{align-items:flex-start;flex-wrap:wrap;gap:8px}
 .program-week-title{flex-basis:100%}
 .program-week-title h2{font-size:20px}
 .program-edit-actions{max-width:100%}
 .program-shift .shift-body{padding:14px}
 .shift-edit-actions{justify-content:flex-start}
 .editor-content .editrow{align-items:flex-start;flex-wrap:wrap}
 .editor-content .editrow .left{flex-basis:100%}
 .edit-switch{padding:8px 0}
}


/* v1.7 trainee-first dashboard and prominent profile navigation */
.overview-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:22px 0 18px}
.overview-head h1{font:400 clamp(26px,3vw,34px)/1.2 'Nixie One',Georgia,serif;margin:3px 0 0}
.overview-eyebrow{font-size:10px;font-weight:700;letter-spacing:.13em;color:#898984}
.overview-trainees{padding:24px}
.overview-trainees .section-heading{margin-bottom:8px}
.overview-trainees .section-heading h2{font-size:22px}
.overview-summary{display:flex;align-items:center;gap:19px;flex-wrap:wrap;color:#898984;font-size:12px;padding:15px 4px}
.person{padding:20px 12px;border-radius:8px;transition:background .15s}
.person:focus-visible{outline:2px solid #777;outline-offset:-2px}
.person .person-identity b{font-family:'DM Sans',Arial,sans-serif;font-size:clamp(20px,2.3vw,26px);font-weight:700;line-height:1.35;display:block;margin-bottom:4px}
.person .person-identity .sub{font-size:12px}
.person .percent{font:600 15px 'DM Sans',Arial,sans-serif;text-align:right}
.person-arrow{font-size:27px;font-weight:300;color:#777;text-align:center}
.person:hover .person-arrow{color:#111}
.trainee-switcher{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0;border:1px solid var(--line);border-bottom:0;border-radius:11px 11px 0 0;overflow:hidden;background:#f0f0ed}
.trainee-switch{display:flex;justify-content:center;align-items:center;text-align:center;min-width:0;min-height:66px;padding:12px 10px;background:#f0f0ed;border:0;border-right:1px solid var(--line);border-radius:0;color:#6c6c68}
.trainee-switch:last-child{border-right:0}
.trainee-switch:hover:not(.active){background:#e8e8e5;color:#222}
.trainee-switch.active{background:#1d1d1d;color:#fff}
.trainee-switch-copy{display:grid;gap:3px;min-width:0}
.trainee-switch-copy strong{font-size:14px;font-weight:700;line-height:1.3}
.trainee-switch-copy small{font-size:11px;color:#7b7b76}
.trainee-switch.active .trainee-switch-copy small{color:#c9c9c9}
.trainee-tab-content{border:1px solid var(--line);border-top:0;background:#fff;border-radius:0 0 11px 11px;padding:20px 21px 24px;min-height:280px}
.trainee-tab-content>.week:first-child{margin-top:0}
.trainee-tab-content>.skill-group:last-child{margin-bottom:0}
.trainee-tab-content>.panel{border:0;padding:0}
.trainee-metrics{grid-template-columns:1fr;margin-bottom:16px}
.trainee-metrics>.metric{padding:14px 19px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.trainee-metrics>.metric strong{font-size:27px;margin:0}
@media(max-width:700px){
 .overview-head{margin:8px 0 16px;align-items:center}
 .overview-head h1{font-size:25px}
 .overview-head .btn{padding:9px 11px;white-space:nowrap}
 .overview-trainees{padding:16px 13px}
 .overview-trainees .section-heading h2{font-size:19px}
 .person{grid-template-columns:minmax(0,1fr) 60px 18px;gap:11px;padding:18px 6px}
 .person .person-identity b{font-size:23px}
 .person .person-identity .sub{font-size:11px}
 .person-progress{display:none}
 .person .percent{display:block!important;font-size:13px!important;text-align:right}
 .person-arrow{font-size:24px}
 .overview-summary{gap:6px 15px;padding:12px 3px}
 .trainee-switcher{gap:0;margin:0}
 .trainee-switch{display:flex;align-items:center;justify-content:center;text-align:center;padding:13px 4px;min-height:61px}
 .trainee-switch-copy strong{font-size:12px}
 .trainee-switch-copy small{font-size:10px;line-height:1.3}

 if(Array.isArray(from)&&Array.isArray(to)&&from.concat(to).every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.id==='string')){

function bindActions(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>onAction(el.dataset.action));document.querySelectorAll('[data-trainee]').forEach(el=>{let fn=()=>{activeTrainee=el.dataset.trainee;traineeTab='roadmap';view='trainee';openShifts=new Set();render();window.scrollTo(0,0)};el.onclick=fn;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}}})}

 const t=trainee(),id=el.dataset.shiftComplete;
 // Keep the checkbox unchanged until a lead signs the completion.
 el.checked=!el.checked;

 }
});document.querySelectorAll('[data-shift-note]').forEach(el=>el.oninput=()=>{let t=trainee();t.shiftNotes??={};t.shiftNotes[el.dataset.shiftNote]=el.value;const noteFlag=document.querySelector(`[data-note-indicator="${el.dataset.shiftNote}"]`);if(noteFlag)noteFlag.classList.toggle('hidden',!(shiftComplete(t,allShifts().find(s=>s.id===el.dataset.shiftNote))&&el.value.trim()));save()});document.querySelectorAll('[data-lead-check]').forEach(el=>el.onchange=()=>{let t=trainee();t.skills??={};let rec=t.skills[el.dataset.leadCheck]??={};rec.approvals??={};rec.approvals[el.dataset.lead]=el.checked;rec.at=today();saveAndRender()});document.querySelectorAll('[data-skill-note]').forEach(el=>el.oninput=()=>{let t=trainee();t.skills??={};t.skills[el.dataset.skill]??={};t.skills[el.dataset.skill].note=el.value;save()});let notes=document.getElementById('generalNotes');if(notes)notes.oninput=()=>{trainee().notes=notes.value;save()}}
function onAction(a){const p=a.split(':');const protectedActions=['reset-program','add-week','add-shift','edit-week','edit-shift','add-task','edit-task','add-skill','edit-skill','edit-category','move-week','move-shift','delete-task','delete-shift','delete-skill'];if((protectedActions.includes(a)||protectedActions.includes(p[0]))&&!editMode){alert('Turn on Edit mode to change training content.');return;}if(a==='show-trainees')return navTo('trainees');if(a==='show-program')return navTo('program');if(a==='show-skills')return navTo('skills');if(a==='add-trainee')return editTrainee();if(a==='edit-trainee')return editTrainee(trainee());if(a==='retry-sync'){setCloudStatus('saving','Retrying synchronization…');scheduleUpload();return}if(a==='export')return exportBackup();if(a==='import')return importBackup();if(a==='reset-program'){if(confirm('Restore default training content? Your trainees will remain.')){data.weeks=clone(SEED.weeks);data.skills=clone(SEED.skills);saveAndRender()}return}if(a==='add-week')return editWeek();if(p[0]==='edit-week')return editWeek(data.weeks.find(w=>w.id===p[1]));if(p[0]==='add-shift')return editShift(null,p[1]);if(p[0]==='edit-shift')return editShift(allShifts().find(s=>s.id===p[1]));if(p[0]==='add-task')return editTask(p[1]);if(p[0]==='edit-task')return editTask(p[1],p[2]);if(p[0]==='edit-category')return editCategory(data.skills.find(c=>c.id===p[1]));if(p[0]==='add-skill')return editSkill(p[1]);if(p[0]==='edit-skill')return editSkill(p[1],p[2]);if(p[0]==='move-week')return moveIn(data.weeks,p[1],p[2]);if(p[0]==='move-shift'){let w=data.weeks.find(w=>w.shifts.some(s=>s.id===p[1]));return moveIn(w?.shifts,p[1],p[2])}if(p[0]==='delete-task')return mutateDelete(()=>{let s=allShifts().find(x=>x.id===p[1]);s.checks=s.checks.filter(x=>x.id!==p[2])},'Remove this checkoff from the program?');if(p[0]==='delete-shift')return mutateDelete(()=>{let w=data.weeks.find(w=>w.shifts.some(s=>s.id===p[1]));w.shifts=w.shifts.filter(s=>s.id!==p[1])},'Remove this shift from the training program?');if(p[0]==='delete-skill')return mutateDelete(()=>{let c=data.skills.find(c=>c.id===p[1]);c.items=c.items.filter(x=>x.id!==p[2])},'Remove this competency?')}
function mutateDelete(fn,msg){if(confirm(msg)){fn();saveAndRender()}}
function moveIn(arr,id,direction){if(!arr)return;let i=arr.findIndex(x=>x.id===id),j=i+(direction==='up'?-1:1);if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];saveAndRender()}
function modal(title,body,commit,other=''){modalState={commit};document.getElementById('overlay-root').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true"><div class="section-heading"><h2>${esc(title)}</h2><button class="btn small" data-close>×</button></div><form id="editForm">${body}<div class="modal-actions">${other}<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn dark">Save</button></div></form></section></div>`;let root=document.getElementById('overlay-root');root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);root.querySelector('.overlay').onclick=e=>{if(e.target===root.querySelector('.overlay'))closeModal()};root.querySelector('form').onsubmit=e=>{e.preventDefault();modalState.commit(new FormData(e.target),e.target)};root.querySelector('input,textarea')?.focus()}
function closeModal(){document.getElementById('overlay-root').innerHTML='';modalState=null;if(cloudReady)requestAnimationFrame(refreshFromCloud)}
function field(label,name,value='',kind='input',required=false){return `<div class="field"><label>${esc(label)}</label>${kind==='textarea'?`<textarea name="${name}" rows="4">${esc(value)}</textarea>`:`<input name="${name}" ${kind==='date'?'type="date"':'type="text"'} value="${esc(value)}" ${required?'required':''}>`}</div>`}

function editWeek(w){modal(w?'Edit week':'Add week',field('Week title','name',w?.name||'','input',true),f=>{let name=f.get('name').trim();if(!name)return;if(w)w.name=name;else data.weeks.push({id:uid(),name,shifts:[]});finish()},w?`<button type="button" id="deleteWeek" class="btn danger">Remove week</button>`:'');if(w)document.getElementById('deleteWeek').onclick=()=>mutateDelete(()=>{data.weeks=data.weeks.filter(x=>x.id!==w.id);closeModal()},'Remove this week and all shifts within it?')}

function editTask(shiftId,itemId){let s=allShifts().find(s=>s.id===shiftId),it=s.checks.find(it=>it.id===itemId);modal(it?'Edit checkoff':'Add checkoff',field('Checkoff description','text',it?.text||'','textarea',true),f=>{let text=f.get('text').trim();if(!text)return;if(it)it.text=text;else s.checks.push({id:uid(),text});finish()})}
function editCategory(cat){if(!editMode||!cat)return;modal('Rename category',field('Category name','name',cat.name,'input',true),f=>{let name=f.get('name').trim();if(!name)return;cat.name=name;finish()})}
function editSkill(catId,itemId){let cat=data.skills.find(c=>c.id===catId),it=cat.items.find(it=>it.id===itemId);modal(it?'Edit competency':'Add competency',field('Competency','text',it?.text||'','textarea',true),f=>{let text=f.get('text').trim();if(!text)return;if(it)it.text=text;else cat.items.push({id:uid(),text});finish()})}
function exportBackup(){let blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='YIHUI_Training_Backup_'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function importBackup(){let i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=()=>{let file=i.files?.[0];if(!file)return;file.text().then(text=>{let o=JSON.parse(text);if(!Array.isArray(o.weeks)||!Array.isArray(o.skills)||!Array.isArray(o.trainees))throw new Error('Unrecognized backup file');if(confirm('Replace all SHARED training records in Firebase with this backup? Other managers will see these changes.')){data={weeks:o.weeks,skills:o.skills,trainees:o.trainees};activeTrainee=null;view='overview';saveAndRender()}}).catch(e=>alert('Could not import: '+e.message))};i.click()}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMobileMenu();closeModal()}});

window.trainingCloud={
 receive(remote){
  const empty=!validCloudData(remote);
  serverData=empty?clone(SEED):clone(remote);
  if(!initialCloudLoaded){
   initialCloudLoaded=true;cloudReady=true;
   data=applyChanges(serverData,[...sendingEdits,...pendingEdits]);shadowData=clone(data);
   document.getElementById('cloudGate')?.remove();
   setCloudStatus('connected','Connected · Changes sync across devices');render();
  }else{
   refreshFromCloud();if(!pendingEdits.length&&!sendingEdits.length)setCloudStatus('connected','Connected · Changes sync across devices');
  }
 },
 error(e){cloudReady=false;setCloudStatus('error','Firebase connection failed: '+(e?.message||String(e))+'\nCheck the Realtime Database rules.');const gate=document.getElementById('cloudGateMessage');if(gate)gate.textContent=cloudStatusText},
 seed(){return clone(SEED)},
 merge(current,ops){return applyChanges(current,ops)},
 async send(ops){return window.__cloudTransaction(ops)}
};
async function uploadChanges(){
 if(sending||!cloudReady||!pendingEdits.length)return;
 sending=true;sendingEdits=pendingEdits.splice(0);
 try{
  await window.trainingCloud.send(sendingEdits);
  sendingEdits=[];setCloudStatus('connected','Connected · Changes synced');
 }catch(e){
  pendingEdits.unshift(...sendingEdits);sendingEdits=[];
  setCloudStatus('error','Sync failed: '+(e?.message||String(e))+'. Changes are pending; retry using the status page.');
 }
 sending=false;
 if(pendingEdits.length&&cloudReady&&cloudStatus!=='error')scheduleUpload();
}
render();
setTimeout(()=>{if(!initialCloudLoaded&&cloudStatus==='connecting'){const gate=document.getElementById('cloudGateMessage');if(gate)gate.textContent='Still connecting to Firebase. Check your internet connection and Realtime Database rules.'}},15000);
